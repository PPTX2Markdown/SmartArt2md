[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartart2md"
version = "0.1.0"
description = "Convert OOXML SmartArt diagrams to Markdown"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
smartart2md = "smartart2md:main"

[tool.setuptools.packages.find]
include = ["smartart2md*"]
